name: Feature idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to make or the problem you run into.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Storyboard Viewer help?
      description: Your idea for a solution, if you have one.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of video do you make?
      multiple: true
      options:
        - Film / short
        - Documentary
        - Animation
        - Motion / brand
        - Short-form vertical (TikTok, Reels, Shorts)
        - Other
